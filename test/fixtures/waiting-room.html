<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Waiting Room powered by Cloudflare</title>
  <style>body{font-family:system-ui;max-width:560px;margin:80px auto;text-align:center;color:#333}</style>
</head>
<body>
  <h1>Waiting Room</h1>
  <p>You are now in line.</p>
  <p>Estimated wait time is 30 minutes.</p>
  <p>This page will redirect you automatically when it is your turn.</p>
  <!-- In production, Cloudflare refreshes every ~30 s. The test uses a much
       shorter interval so the browser fetches again quickly after the mock
       server switches its response from waiting-room to cleared. -->
  <script>setTimeout(function(){location.reload();}, 1500);</script>
</body>
</html>
