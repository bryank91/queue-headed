# Copy to config.yml. EB Games uses separate browser profiles from Toymate.
queue:
  statusSource: "ebgames"
  siteName: "EB Games"
  startUrl: "https://www.ebgames.com.au/"
  profileCount: 1
  profileBaseDir: "profiles"
  pollIntervalMs: 4000
  suppressWhenChromeFocused: true
  notifyOnBrowserOpen: true
  maxRuntimeMs: 0
  openOnClear: true
  closeOthersOnClear: true
  notifySubtitle: "EB Games Queue Watcher"
  verbose: true
  browser:
    channel: "chrome"
    headless: false
    locale: "en-AU"
    timezoneId: "Australia/Perth"
    acceptLanguage: "en-AU,en;q=0.9"
