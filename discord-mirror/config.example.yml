# Copy this file to config.yml and replace the placeholders.
# config.yml is ignored because it contains credentials and local settings.

token: "REPLACE_WITH_DISCORD_ACCOUNT_TOKEN"
status: "online"
logMessage: "[%date%] Mirrored @%author%'s message from %server% #%channel%."

mirrors: {}

db:
  directory: "./data/identifier.db"

toymateTrigger:
  enabled: false

  # Restrict matching to the alert channel and, optionally, the alert bot.
  channelIds: []
  authorIds: []

  # At least one match rule must match. Rules are tested against the message
  # content plus every embed URL, embed title/description, and embed field.
  # For "a Toymate link appeared" triggers, use contentIncludes (or regex):
  #   contentIncludes:
  #     - "toymate.com.au"
  contentEquals:
    - "Toymate queue is open"
  contentIncludes:
    - "toymate.com.au"
    - "Queue is up!"
  regex: ""

  cooldownSeconds: 300
  watcherPath: "../toymate/watcher.js"
  watcherConfigPath: "../toymate/config.yml"
  workingDirectory: "../toymate"

  notifications:
    enabled: true
    webhookUrls: []
    postStarted: true
    postWaitingRoom: true
    postCleared: true
    postStopped: true
    postErrors: true

# Independent EB Games alert and watcher. Fill in the channel and enable after
# checking a real EB Games alert. Its browser profiles live under ../ebgames/.
ebGamesTrigger:
  enabled: false
  channelIds: []
  authorIds: []
  contentEquals: []
  contentIncludes:
    - "ebgames.com.au"
    - "Queue is up!"
  regex: ""
  cooldownSeconds: 300
  watcherPath: "../ebgames/watcher.js"
  watcherConfigPath: "../ebgames/config.yml"
  workingDirectory: "../ebgames"
  notifications:
    enabled: false
    webhookUrls: []
    postStarted: true
    postWaitingRoom: true
    postCleared: true
    postStopped: true
    postErrors: true
